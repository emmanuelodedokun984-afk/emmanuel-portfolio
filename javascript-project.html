<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Project | Emmanuel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 25px;
        }

        #counter {
            font-size: 60px;
            margin: 25px 0;
            color: #38bdf8;
        }

        button,
        a {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #38bdf8;
            color: #020617;
        }

        .back {
            display: inline-block;
            background: #334155;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>JavaScript Counter 🚀</h1>

        <p>A simple interactive project built with JavaScript.</p>

        <div id="counter">0</div>

        <button onclick="decrease()">−</button>
        <button onclick="increase()">+</button>
        <button onclick="resetCounter()">Reset</button>

        <br>

        <a href="index.html" class="back">Back to Portfolio</a>
    </div>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("counter").textContent = count;
        }

        function decrease() {
            count--;
            document.getElementById("counter").textContent = count;
        }

        function resetCounter() {
            count = 0;
            document.getElementById("counter").textContent = count;
        }
    </script>

</body>
</html>
