<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page | Emmanuel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        p {
            font-size: 20px;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            background: #38bdf8;
            color: #020617;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Welcome to My Landing Page 🚀</h1>

        <p>
            This is a responsive landing page created by Emmanuel
            using HTML and CSS.
        </p>

        <a href="index.html" class="button">Back to Portfolio</a>
    </div>

</body>
</html>
